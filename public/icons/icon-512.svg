<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A8F6A" />
      <stop offset="100%" stop-color="#0B6B50" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#medGrad)" />
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.12" />
  
  <!-- Medical Cross + Ayurvedic Leaf Combo Symbol -->
  <g filter="url(#shadow)">
    <!-- Central White Rounded Cross Base -->
    <rect x="216" y="120" width="80" height="272" rx="20" fill="#ffffff" />
    <rect x="120" y="216" width="272" height="80" rx="20" fill="#ffffff" />
    
    <!-- Ayurvedic Healing Leaf Icon across Cross -->
    <path d="M256 160 C320 160 360 210 360 270 C360 330 300 360 256 360 C212 360 152 330 152 270 C152 210 192 160 256 160 Z" fill="url(#leafGrad)" opacity="0.9" />
    
    <!-- Inner Leaf Vein -->
    <path d="M256 170 Q256 260 256 345" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M256 220 Q290 200 320 210" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M256 260 Q215 240 185 250" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M256 295 Q285 280 310 290" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Subtle JJ initials at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">JIVAN JOYTI</text>
</svg>
